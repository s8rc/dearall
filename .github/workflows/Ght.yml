name: Tailscale Exit Node (Windows)

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  vpn-exit-node:
    runs-on: windows-latest
    steps:
      # 1. Enable IP Forwarding (PowerShell)
      # Windows defaults to blocking routing. We must enable it on all interfaces.
      - name: Enable IP Forwarding
        run: |
          Set-NetIPInterface -Forwarding Enabled
        shell: powershell

      # 2. Connect to Tailscale
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:p
          # Using --unattended is often helpful on Windows to suppress prompts
          args: --advertise-exit-node --hostname=gh-action-win-exit --ephemeral --unattended

      # 3. Keep Alive (Max 6 hours)
      - name: Keep Connection Alive
        timeout-minutes: 360
        run: |
          Write-Host "Tailscale Exit Node (Windows) is active."
          Write-Host "This runner will remain active for approx 6 hours."
          # PowerShell command to sleep for 21300 seconds (approx 5h 55m)
          Start-Sleep -Seconds 21300
        shell: powershell
