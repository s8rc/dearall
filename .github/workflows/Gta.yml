name: Compile DCA3 (GTA 3 Dreamcast) CDI

on:
  workflow_dispatch:
    inputs:
      game_link:
        description: 'Direct Link to GTA 3 PC Files (.zip or .7z)'
        required: true
        default: ''

jobs:
  build-dreamcast-cdi:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Install Dependencies
        run: |
          sudo apt-get update
          # binutils-multiarch is CRITICAL for objcopy (ELF -> BIN conversion)
          sudo apt-get install -y genisoimage p7zip-full wget make cmake build-essential git binutils-multiarch zlib1g-dev libpng-dev
          
      - name: 🛠️ Build cdi4dc (Corrected)
        run: |
          # Clone recursively
          git clone --recursive https://github.com/kazade/img4dc.git
          
          # CRITICAL FIX: Build from the ROOT folder, not the subdir
          cd img4dc
          mkdir build && cd build
          cmake ..
          make
          
          # Manually install the binary (Standard CMake install might be missing in this repo)
          echo "Installing cdi4dc to /usr/local/bin..."
          sudo cp cdi4dc/cdi4dc /usr/local/bin/cdi4dc
          sudo chmod +x /usr/local/bin/cdi4dc
          
      - name: ⬇️ Download Latest DCA3 Executable (ELF)
        run: |
          mkdir -p dca3-game/liberty
          
          # Download latest artifact from GitLab CI
          wget -O artifacts.zip "https://gitlab.com/skmp/dca3-game/-/jobs/artifacts/beta/download?job=build-liberty"
          unzip -o artifacts.zip -d dca3-game/liberty
          
          # Ensure ELF is in the right place
          find dca3-game/liberty -name "dca-liberty.elf" -exec mv {} dca3-game/liberty/ \;

      - name: 🎮 Download & Extract User Game Assets
        run: |
          echo "Downloading Game Assets..."
          wget -O game_assets.archive "${{ github.event.inputs.game_link }}"
          
          mkdir -p temp_assets
          7z x game_assets.archive -otemp_assets -y
          
          # Smart search for game root
          GAME_ROOT=$(find temp_assets -name "gta3.exe" -printf "%h\n" | head -n 1)
          if [ -z "$GAME_ROOT" ]; then
            GAME_ROOT=$(find temp_assets -type d -name "models" -printf "%h\n" | head -n 1)
          fi
          
          if [ -z "$GAME_ROOT" ]; then
            echo "❌ Could not find GTA 3 root folder (looking for gta3.exe or models folder)"
            exit 1
          fi
          
          echo "✅ Found Game Root at: $GAME_ROOT"
          cp -r "$GAME_ROOT"/* dca3-game/liberty/

      - name: 💿 Prepare Disc Image
        run: |
          cd dca3-game/liberty
          
          # 1. Get IP.BIN (Boot Sector)
          wget -O IP.BIN https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/kernel/arch/dreamcast/kernel/IP.BIN
          
          # 2. Get Scramble Tool
          wget https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/utils/scramble/scramble.c
          gcc scramble.c -o scramble
          
          # 3. Convert ELF to BIN (Using objcopy from binutils-multiarch)
          # This converts the code to a raw binary format the Dreamcast understands
          objcopy -O binary dca-liberty.elf main.bin
          
          # 4. Scramble the Binary (Required for Dreamcast boot)
          ./scramble main.bin 1ST_READ.BIN
          
          # 5. Clean up temp files
          rm dca-liberty.elf main.bin scramble.c scramble
          
          # 6. Create ISO
          # -C 0,11702 is the specific offset for self-booting Dreamcast discs
          mkisofs -C 0,11702 -V DCA3 -G IP.BIN -r -J -l -o dca3.iso .
          
          # 7. Convert to CDI using our newly built tool
          cdi4dc dca3.iso dca3_liberty.cdi

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Dreamcast-CDI
          path: dca3-game/liberty/dca3_liberty.cdi
          compression-level: 0
