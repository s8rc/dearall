name: Compile DCA3 (GTA 3 Dreamcast) CDI

on:
  workflow_dispatch:
    inputs:
      game_link:
        description: 'Direct Link to GTA 3 PC Files (.zip or .7z)'
        required: true
        default: ''

jobs:
  build-dreamcast-cdi:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Install Dependencies
        run: |
          sudo apt-get update
          # Added binutils-multiarch (for objcopy) and libpng-dev (for img4dc)
          sudo apt-get install -y genisoimage p7zip-full wget make cmake build-essential git binutils-multiarch zlib1g-dev libpng-dev
          
      - name: 🛠️ Build cdi4dc (Fixed)
        run: |
          # FIXED: Added --recursive to fetch libedc submodule
          git clone --recursive https://github.com/kazade/img4dc.git
          cd img4dc/cdi4dc
          mkdir build && cd build
          cmake ..
          make
          sudo make install
          
      - name: ⬇️ Download Latest DCA3 Executable (ELF)
        run: |
          # Create folder structure
          mkdir -p dca3-game/liberty
          
          # Download latest artifact from GitLab CI
          wget -O artifacts.zip "https://gitlab.com/skmp/dca3-game/-/jobs/artifacts/beta/download?job=build-liberty"
          unzip -o artifacts.zip -d dca3-game/liberty
          
          # Ensure ELF is in the right place
          find dca3-game/liberty -name "dca-liberty.elf" -exec mv {} dca3-game/liberty/ \;

      - name: 🎮 Download & Extract User Game Assets
        run: |
          echo "Downloading Game Assets..."
          wget -O game_assets.archive "${{ github.event.inputs.game_link }}"
          
          mkdir -p temp_assets
          7z x game_assets.archive -otemp_assets -y
          
          # Smart search for game root
          GAME_ROOT=$(find temp_assets -name "gta3.exe" -printf "%h\n" | head -n 1)
          if [ -z "$GAME_ROOT" ]; then
            GAME_ROOT=$(find temp_assets -type d -name "models" -printf "%h\n" | head -n 1)
          fi
          
          if [ -z "$GAME_ROOT" ]; then
            echo "❌ Could not find GTA 3 root folder (looking for gta3.exe or models folder)"
            exit 1
          fi
          
          echo "✅ Found Game Root at: $GAME_ROOT"
          cp -r "$GAME_ROOT"/* dca3-game/liberty/

      - name: 💿 Prepare Disc Image
        run: |
          cd dca3-game/liberty
          
          # 1. Get IP.BIN (Boot Sector)
          wget -O IP.BIN https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/kernel/arch/dreamcast/kernel/IP.BIN
          
          # 2. Get Scramble Tool
          wget https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/utils/scramble/scramble.c
          gcc scramble.c -o scramble
          
          # 3. Convert ELF to BIN (Using objcopy from binutils-multiarch)
          # This converts the code to a raw binary format the Dreamcast understands
          objcopy -O binary dca-liberty.elf main.bin
          
          # 4. Scramble the Binary (Required for Dreamcast boot)
          ./scramble main.bin 1ST_READ.BIN
          
          # 5. Clean up temp files to save space on disc
          rm dca-liberty.elf main.bin scramble.c scramble
          
          # 6. Create ISO
          # -C 0,11702 is the specific offset for self-booting Dreamcast discs
          mkisofs -C 0,11702 -V DCA3 -G IP.BIN -r -J -l -o dca3.iso .
          
          # 7. Convert to CDI
          cdi4dc dca3.iso dca3_liberty.cdi

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Dreamcast-CDI
          path: dca3-game/liberty/dca3_liberty.cdi
          compression-level: 0


          # This saves 30+ mins of compiling C++ code and ensures you get the latest Beta
          mkdir -p dca3-game/liberty
          wget -O artifacts.zip "https://gitlab.com/skmp/dca3-game/-/jobs/artifacts/beta/download?job=build-liberty"
          unzip artifacts.zip -d dca3-game/liberty
          
          # Move ELF to expected location if zip structure differs
          find dca3-game/liberty -name "dca-liberty.elf" -exec mv {} dca3-game/liberty/ \;

      - name: 🎮 Download & Extract User Game Assets
        run: |
          echo "Downloading Game Assets from user link..."
          wget -O game_assets.archive "${{ github.event.inputs.game_link }}"
          
          # Create a temp folder to extract
          mkdir -p temp_assets
          
          # Try extracting as 7z (covers zip, rar, 7z)
          7z x game_assets.archive -otemp_assets -y
          
          # Locate the folder containing 'gta3.exe' or 'models' folder to find the root
          GAME_ROOT=$(find temp_assets -name "gta3.exe" -printf "%h\n" | head -n 1)
          if [ -z "$GAME_ROOT" ]; then
            GAME_ROOT=$(find temp_assets -type d -name "models" -printf "%h\n" | head -n 1)
          fi
          
          if [ -z "$GAME_ROOT" ]; then
            echo "❌ Could not find GTA 3 root folder (looking for gta3.exe or models folder)"
            exit 1
          fi
          
          echo "✅ Found Game Root at: $GAME_ROOT"
          
          # Move contents to the liberty folder required by DCA3
          cp -r "$GAME_ROOT"/* dca3-game/liberty/

      - name: 💿 Compile Disc Image (CDI)
        run: |
          cd dca3-game/liberty
          
          # 1. Convert ELF to BIN (Scramble)
          # We need a scrambler. We will use a simple python script or assuming the elf is ready.
          # Actually, standard flow uses 'sh-elf-objcopy' then 'scramble'. 
          # Since we lack the KOS toolchain, we will use the 'make cdi-prebuilt' logic manually using generic tools.
          
          # Note: The official 'make cdi-prebuilt' relies on windows tools in the repo. 
          # We will construct the ISO manually for Linux compatibility.
          
          # Check for IP.BIN
          if [ ! -f "../IP.BIN" ]; then
             echo "⚠️ IP.BIN missing, fetching generic one..."
             wget -O IP.BIN https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/kernel/arch/dreamcast/kernel/IP.BIN
          else
             cp ../IP.BIN .
          fi
          
          # Create ISO (Standard Dreamcast LBA 11702)
          # Note: We are putting the ELF directly. If the loader expects a binary, this step might vary
          # but modern homebrew often uses ELF loaders. 
          # However, DCA3 expects '1ST_READ.BIN'.
          
          # We need to scramble the ELF to BIN. 
          # Downloading a portable scrambler tool
          wget https://github.com/kallisti-dev/kos-ports/raw/master/utils/scramble/scramble.c
          gcc scramble.c -o scramble
          
          # Strip ELF (requires multiarch binutils or just try raw copy)
          # Since we don't have sh4-elf-objcopy, we assume the provided ELF is stripped or use raw.
          # WORKAROUND: We will attempt to use the provided 'dca-liberty.elf' as is, 
          # but usually it needs objcopy. 
          # Alternative: Use the pre-scrambled binary if available in artifacts?
          # The artifact usually contains only the ELF.
          
          # If this step fails, we need the full KOS container.
          # For this simplified workflow, we trust the repo might have a helper or we just package the ELF.
          # The official makefile does: $(KOS_OBJCOPY) -O binary $(TARGET) $(TARGET:.elf=.bin)
          
          echo "⚠️ Skipping OBJCOPY (No SH4 Toolchain). Packaging ELF directly as 1ST_READ.BIN (Experimental)"
          # NOTE: If the game crashes, the ELF needs to be converted to BIN using 'sh-elf-objcopy'.
          # We rename it for the ISO generation.
          cp dca-liberty.elf 1ST_READ.BIN
          
          # Create ISO
          mkisofs -C 0,11702 -V DCA3 -G IP.BIN -r -J -l -o dca3.iso .
          
          # Convert to CDI
          cdi4dc dca3.iso dca3_liberty.cdi

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Dreamcast-CDI
          path: dca3-game/liberty/dca3_liberty.cdi
          compression-level: 0 # Faster upload

