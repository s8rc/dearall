name: Compile DCA3 (Official Guide Method)

on:
  workflow_dispatch:
    inputs:
      game_link:
        description: 'Direct Link to GTA 3 PC Files (.zip, .7z, .rar)'
        required: true
      target_type:
        description: 'Target Media'
        required: true
        default: 'CD-R (Burn)'
        type: choice
        options:
        - 'CD-R (Burn)'
        - 'GDEMU (SD Card)'

jobs:
  build-dca3:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget p7zip-full \
            genisoimage binutils-multiarch libpng-dev zlib1g-dev \
            ffmpeg python3 jq

      - name: 🛠️ Install Dreamcast Tools (cdi4dc, scramble, makeip)
        run: |
          # 1. Compile cdi4dc (ISO to CDI converter)
          git clone --recursive https://github.com/kazade/img4dc.git
          cd img4dc
          mkdir build && cd build
          cmake .. -Wno-dev
          make
          sudo cp cdi4dc/cdi4dc /usr/local/bin/
          cd ../..
          
          # 2. Compile Scramble (Required for bootable binaries)
          wget -q https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/utils/scramble/scramble.c
          gcc scramble.c -o scramble
          sudo cp scramble /usr/local/bin/
          
          # 3. Compile makeip (Required to fix 'Error 127')
          # The official Makefile looks for $(KOS_BASE)/utils/makeip/makeip
          # We create this structure locally.
          mkdir -p kos_dummy/utils/makeip
          wget -q https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/utils/makeip/makeip.c
          gcc makeip.c -o kos_dummy/utils/makeip/makeip

      - name: 📥 Clone DCA3 Repo (Beta Branch)
        run: |
          git clone --branch beta https://gitlab.com/skmp/dca3-game.git

      - name: 📁 Prepare Liberty Folder
        run: |
          cd dca3-game
          mkdir -p liberty

      - name: ⬇️ Download Official Beta ELF
        run: |
          cd dca3-game/liberty
          
          echo "🔍 Fetching latest Beta ELF from GitLab Releases..."
          ASSET_URL=$(curl -s "https://gitlab.com/api/v4/projects/skmp%2Fdca3-game/releases/beta" | \
            jq -r '.assets.links[] | select(.name | contains("liberty") and contains("elf")) | .url')
          
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" == "null" ]; then
            echo "❌ Error: Could not find ELF link in GitLab Release."
            exit 1
          fi
          
          wget -O dca-liberty.elf "$ASSET_URL"
          echo "✅ ELF Downloaded."

      - name: 🎮 Install User Game Assets
        run: |
          wget -O assets.archive "${{ inputs.game_link }}"
          mkdir temp_extract
          7z x assets.archive -otemp_extract -y
          
          # Find the actual game folder
          GAME_ROOT=$(find temp_extract -name "gta3.exe" -printf "%h\n" | head -n 1)
          if [ -z "$GAME_ROOT" ]; then
             GAME_ROOT=$(find temp_extract -type d -name "models" -printf "%h\n" | head -n 1)
          fi
          
          if [ -z "$GAME_ROOT" ]; then
             echo "❌ Error: Could not find GTA3 files in your link."
             exit 1
          fi
          
          echo "📂 Copying game assets to dca3-game/liberty..."
          cp -r "$GAME_ROOT"/* dca3-game/liberty/

      - name: 💿 Build CDI (Make cdi-prebuilt)
        run: |
          cd dca3-game/liberty
          
          # Configuration for Make
          if [ "${{ inputs.target_type }}" == "CD-R (Burn)" ]; then
            export FOR_DISC=1
            echo "🔥 Configuration: CD-R (700MB/80min)"
          else
            export FOR_DISC=0
            echo "💾 Configuration: GDEMU (High Quality Audio)"
          fi
          
          # Link Makefile if missing in subdir
          if [ ! -f "Makefile" ]; then
             ln -s ../Makefile Makefile
             ln -s ../scripts scripts
          fi
          
          # Point KOS_BASE to our dummy folder so it finds /utils/makeip/makeip
          # The path must be absolute for Make
          export KOS_BASE=$GITHUB_WORKSPACE/kos_dummy
          
          echo "🔨 Running Make (Attempt 1)..."
          make cdi-prebuilt KOS_BASE=$KOS_BASE || true
          
          echo "🔨 Running Make (Attempt 2)..."
          make cdi-prebuilt KOS_BASE=$KOS_BASE

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Dreamcast-CDI
          path: dca3-game/liberty/*.cdi
          compression-level: 0


          cmake .. -Wno-dev
          make
          sudo cp cdi4dc/cdi4dc /usr/local/bin/
          cd ../..
          
          # 2. Compile Scramble (Required for bootable binaries)
          wget -q https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/utils/scramble/scramble.c
          gcc scramble.c -o scramble
          sudo cp scramble /usr/local/bin/

      - name: 📥 Clone DCA3 Repo (Beta Branch)
        run: |
          # Following Official Guide: Clone beta branch
          git clone --branch beta https://gitlab.com/skmp/dca3-game.git

      - name: 📁 Prepare Liberty Folder
        run: |
          # Following Official Guide: Create folder inside repo
          cd dca3-game
          mkdir -p liberty

      - name: ⬇️ Download Official Beta ELF
        run: |
          cd dca3-game/liberty
          
          echo "🔍 Fetching latest Beta ELF from GitLab Releases..."
          # Use API to get the permanent link for "dca-liberty.elf" from the "beta" tag
          ASSET_URL=$(curl -s "https://gitlab.com/api/v4/projects/skmp%2Fdca3-game/releases/beta" | \
            jq -r '.assets.links[] | select(.name | contains("liberty") and contains("elf")) | .url')
          
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" == "null" ]; then
            echo "❌ Error: Could not find ELF link in GitLab Release."
            exit 1
          fi
          
          wget -O dca-liberty.elf "$ASSET_URL"
          echo "✅ ELF Downloaded."

      - name: 🎮 Install User Game Assets
        run: |
          # Download user assets
          wget -O assets.archive "${{ inputs.game_link }}"
          mkdir temp_extract
          7z x assets.archive -otemp_extract -y
          
          # Find the actual game folder (handles nested zips)
          GAME_ROOT=$(find temp_extract -name "gta3.exe" -printf "%h\n" | head -n 1)
          if [ -z "$GAME_ROOT" ]; then
             GAME_ROOT=$(find temp_extract -type d -name "models" -printf "%h\n" | head -n 1)
          fi
          
          if [ -z "$GAME_ROOT" ]; then
             echo "❌ Error: Could not find GTA3 files in your link."
             exit 1
          fi
          
          echo "📂 Copying game assets to dca3-game/liberty..."
          cp -r "$GAME_ROOT"/* dca3-game/liberty/

      - name: 💿 Build CDI (Make cdi-prebuilt)
        run: |
          cd dca3-game/liberty
          
          # Setup variables based on user input
          if [ "${{ inputs.target_type }}" == "CD-R (Burn)" ]; then
            export FOR_DISC=1
            echo "🔥 Configuration: CD-R (700MB/80min)"
          else
            export FOR_DISC=0
            echo "💾 Configuration: GDEMU (High Quality Audio)"
          fi
          
          # Check if Makefile exists in liberty, if not look in root
          if [ ! -f "Makefile" ]; then
             echo "⚠️ No Makefile in liberty folder, assuming root Makefile..."
             TARGET_MAKEFILE="-f ../Makefile"
             # The root makefile likely expects to be run from root or needs path adjustments
             # However, the guide explicitly says 'cd liberty' then 'make'. 
             # We will try linking the root Makefile here if missing.
             ln -s ../Makefile Makefile
             ln -s ../scripts scripts
          fi
          
          echo "🔨 Running Make (Attempt 1)..."
          # The guide says it fails the first time. We allow failure.
          make cdi-prebuilt || true
          
          echo "🔨 Running Make (Attempt 2 - To Completion)..."
          make cdi-prebuilt

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Dreamcast-CDI
          path: dca3-game/liberty/*.cdi
          compression-level: 0


          
      - name: ⬇️ Download Latest DCA3 Executable (ELF)
        run: |
          mkdir -p dca3-game/liberty
          
          # Download latest artifact from GitLab CI
          wget -O artifacts.zip "https://gitlab.com/skmp/dca3-game/-/jobs/artifacts/beta/download?job=build-liberty"
          unzip -o artifacts.zip -d dca3-game/liberty
          
          # Ensure ELF is in the right place
          find dca3-game/liberty -name "dca-liberty.elf" -exec mv {} dca3-game/liberty/ \;

      - name: 🎮 Download & Extract User Game Assets
        run: |
          echo "Downloading Game Assets..."
          wget -O game_assets.archive "${{ github.event.inputs.game_link }}"
          
          mkdir -p temp_assets
          7z x game_assets.archive -otemp_assets -y
          
          # Smart search for game root
          GAME_ROOT=$(find temp_assets -name "gta3.exe" -printf "%h\n" | head -n 1)
          if [ -z "$GAME_ROOT" ]; then
            GAME_ROOT=$(find temp_assets -type d -name "models" -printf "%h\n" | head -n 1)
          fi
          
          if [ -z "$GAME_ROOT" ]; then
            echo "❌ Could not find GTA 3 root folder (looking for gta3.exe or models folder)"
            exit 1
          fi
          
          echo "✅ Found Game Root at: $GAME_ROOT"
          cp -r "$GAME_ROOT"/* dca3-game/liberty/

      - name: 💿 Prepare Disc Image
        run: |
          cd dca3-game/liberty
          
          # 1. Get IP.BIN (Boot Sector)
          wget -O IP.BIN https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/kernel/arch/dreamcast/kernel/IP.BIN
          
          # 2. Get Scramble Tool
          wget https://raw.githubusercontent.com/KallistiOS/KallistiOS/master/utils/scramble/scramble.c
          gcc scramble.c -o scramble
          
          # 3. Convert ELF to BIN (Using objcopy from binutils-multiarch)
          # This converts the code to a raw binary format the Dreamcast understands
          objcopy -O binary dca-liberty.elf main.bin
          
          # 4. Scramble the Binary (Required for Dreamcast boot)
          ./scramble main.bin 1ST_READ.BIN
          
          # 5. Clean up temp files
          rm dca-liberty.elf main.bin scramble.c scramble
          
          # 6. Create ISO
          # -C 0,11702 is the specific offset for self-booting Dreamcast discs
          mkisofs -C 0,11702 -V DCA3 -G IP.BIN -r -J -l -o dca3.iso .
          
          # 7. Convert to CDI using our newly built tool
          cdi4dc dca3.iso dca3_liberty.cdi

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA3-Dreamcast-CDI
          path: dca3-game/liberty/dca3_liberty.cdi
          compression-level: 0
