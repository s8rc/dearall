name: ubunturdp
on: 
  workflow_dispatch:
    inputs:
      auth:
        description: 'GRDP Authorization Code'
        required: true
        default: 'paste your code here'
   
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Creating User to Login
      run: |
         sudo useradd -m Ubuntu 
         sudo adduser Ubuntu sudo
         echo 'Ubuntu:1234' | sudo chpasswd
         sudo sed -i 's/\/bin\/sh/\/bin\/bash/g' /etc/passwd
         echo 'Ubuntu ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/Ubuntu
         sudo chmod 0440 /etc/sudoers.d/Ubuntu

    - name: Installing Desktop Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y xfce4 xfce4-terminal desktop-base xscreensaver dbus-x11 policykit-1

    - name: FIX - Prevent Polkit Crashes
      run: |
        sudo bash -c 'cat <<EOF > /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla
        [Allow Colord all Users]
        Identity=unix-user:*
        Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
        ResultAny=no
        ResultInactive=no
        ResultActive=yes
        EOF'

    - name: Installing Google Chrome Remote Desktop
      run: |
        sudo apt-get install -y xbase-clients python3-psutil xserver-xorg-video-dummy xvfb
        wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        sudo dpkg -i chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y
        sudo groupadd -f chrome-remote-desktop

        # --- CRITICAL FIX START ---
        # We use startxfce4 instead of xfce4-session to ensure D-Bus starts correctly
        sudo bash -c 'echo "unset DBUS_SESSION_BUS_ADDRESS" > /home/Ubuntu/.chrome-remote-desktop-session'
        sudo bash -c 'echo "unset XDG_RUNTIME_DIR" >> /home/Ubuntu/.chrome-remote-desktop-session'
        sudo bash -c 'echo "export CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=1280x720" >> /home/Ubuntu/.chrome-remote-desktop-session'
        sudo bash -c 'echo "exec /usr/bin/startxfce4" >> /home/Ubuntu/.chrome-remote-desktop-session'
        # --- CRITICAL FIX END ---
        
        sudo chown Ubuntu:Ubuntu /home/Ubuntu/.chrome-remote-desktop-session
        sudo chmod 755 /home/Ubuntu/.chrome-remote-desktop-session

        sudo systemctl disable lightdm.service 2>/dev/null || true
        sudo systemctl stop lightdm.service 2>/dev/null || true
        sudo adduser Ubuntu chrome-remote-desktop

    - name: Installing Google Chrome & Tools
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
        sudo apt-get install -y python3-pip nautilus nano expect
        pip3 install nbformat gdown pika --break-system-packages

    - name: Installing VS Code & Node
      run: |
        wget -O code.deb https://code.visualstudio.com/sha/download?build=stable\&os=linux-deb-x64
        sudo dpkg -i code.deb
        wget -qO- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
        source ~/.nvm/nvm.sh
        nvm install node

    - name: Generate Setup Script
      run: |
        touch setup.sh
        echo "${{ github.event.inputs.auth }}" >> "setup.sh"
        chmod 777 setup.sh

    - name: Initialize GRDP
      run: |   
        sudo systemctl stop chrome-remote-desktop
        sudo -u Ubuntu bash -c '
        expect -c "
        spawn ./setup.sh
        expect \"Enter a PIN of at least six digits: \"
        send \"123456\r\"
        expect \"Enter the same PIN again: \"
        send \"123456\r\"
        expect eof
        "
        '
        sudo systemctl start chrome-remote-desktop

    - name: Keep Alive
      run: |
        while true; do sleep 30; done
